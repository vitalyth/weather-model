services:
  backend:
    image: ghcr.io/vitalyth/weather-model/backend:latest
    container_name: weather-model-backend
    restart: unless-stopped
    environment:
      WEATHER_DATABASE_URL: sqlite:////app/data/weather_model.db
      WEATHER_CORS_ORIGIN_REGEX: "https?://.*"
      WEATHER_BACKGROUND_COLLECTION_ENABLED: "false"
      WEATHER_BACKGROUND_COLLECTION_INTERVAL_MINUTES: "60"
    expose:
      - "8000"
    volumes:
      - weather-model-data:/app/data

  collector:
    image: ghcr.io/vitalyth/weather-model/backend:latest
    container_name: weather-model-collector
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      WEATHER_DATABASE_URL: sqlite:////app/data/weather_model.db
      WEATHER_BACKGROUND_COLLECTION_ENABLED: "true"
      WEATHER_BACKGROUND_COLLECTION_INTERVAL_MINUTES: "60"
      WEATHER_BACKGROUND_COLLECTION_STARTUP_DELAY_SECONDS: "0"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - weather-model-data:/app/data

  frontend:
    image: ghcr.io/vitalyth/weather-model/frontend:latest
    container_name: weather-model-frontend
    restart: unless-stopped
    environment:
      WEATHER_API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  weather-model-data:
