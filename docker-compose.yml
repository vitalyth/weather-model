services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: weather-model-backend:local
    container_name: weather-model-backend
    restart: unless-stopped
    environment:
      WEATHER_DATABASE_URL: sqlite:////app/data/weather_model.db
      WEATHER_BACKGROUND_COLLECTION_ENABLED: "true"
      WEATHER_BACKGROUND_COLLECTION_INTERVAL_MINUTES: "60"
    ports:
      - "8000:8000"
    volumes:
      - weather-model-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: weather-model-frontend:local
    container_name: weather-model-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  weather-model-data:
